# 部署到 GitHub Pages
# 触发：推送到 main 分支，或在 Actions 页面手动触发
# 部署目标：项目站点 https://<用户名>.github.io/<仓库名>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，不取消进行中的任务（避免覆盖）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 用 npm install 而非 npm ci：本仓库 lock 在 Windows 上生成，
      # 用 install 可让 runner 自动补齐 Linux 平台的 esbuild/rollup 可选依赖
      - name: 安装依赖
        run: npm install

      # 动态设置 base 为 /<仓库名>/，保证项目站点资源路径正确
      - name: 构建
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
